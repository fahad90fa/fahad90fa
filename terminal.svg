<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="884" height="504" rx="14" fill="#0d1117" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="8" y="8" width="884" height="504" rx="14" fill="url(#scan)"/>

  <!-- title bar -->
  <circle cx="42" cy="36" r="6.5" fill="#ff5f56"/>
  <circle cx="64" cy="36" r="6.5" fill="#ffbd2e"/>
  <circle cx="86" cy="36" r="6.5" fill="#27c93f"/>
  <text x="450" y="41" text-anchor="middle" fill="#8b949e" font-size="15">fahad@redteam: ~/engagement — bash</text>
  <line x1="20" y1="56" x2="880" y2="56" stroke="#21262d" stroke-width="1"/>

  <!-- session -->
  <g font-size="16.5" filter="url(#glow)">
    <text x="36" y="96" opacity="0">
      <tspan fill="#58a6ff">fahad@redteam</tspan><tspan fill="#8b949e">:~$</tspan><tspan fill="#c9d1d9"> ./engage.sh --scope authorized</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="0s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="130" opacity="0">
      <tspan fill="#39d0d8">[recon]</tspan><tspan fill="#c9d1d9">   nmap -sV target.lab</tspan><tspan fill="#3fb950">    ✓ done</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="0.9s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="164" opacity="0">
      <tspan fill="#8b949e">          22·ssh    80·http    443·https</tspan><tspan fill="#3fb950">    OPEN</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="1.8s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="198" opacity="0">
      <tspan fill="#39d0d8">[fuzz]</tspan><tspan fill="#c9d1d9">    ffuf -u target.lab/FUZZ</tspan><tspan fill="#3fb950">    200 /admin</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="2.7s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="232" opacity="0">
      <tspan fill="#39d0d8">[vuln]</tspan><tspan fill="#d29922">    SQLi · XSS · IDOR · SSRF · broken-auth</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="3.6s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="266" opacity="0">
      <tspan fill="#39d0d8">[chain]</tspan><tspan fill="#c9d1d9">   idor → ssrf → rce</tspan><tspan fill="#8b949e">    crafting PoC…</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="4.5s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="300" opacity="0">
      <tspan fill="#39d0d8">[shell]</tspan><tspan fill="#c9d1d9">   www-data@target</tspan><tspan fill="#8b949e">   uid=33</tspan><tspan fill="#3fb950">   ✓</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="5.4s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="334" opacity="0">
      <tspan fill="#39d0d8">[privesc]</tspan><tspan fill="#c9d1d9"> escalation →</tspan><tspan fill="#f85149"> root  uid=0</tspan><tspan fill="#3fb950">   ✓</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="6.3s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="368" opacity="0">
      <tspan fill="#39d0d8">[report]</tspan><tspan fill="#c9d1d9">  CVSS · OWASP Top 10 · MITRE ATT&amp;CK</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="7.2s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="402" opacity="0">
      <tspan fill="#39d0d8">[result]</tspan><tspan fill="#3fb950">  100% remediation on retest</tspan><tspan fill="#58a6ff">    4.9/5 ★</tspan>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="13s" begin="8.1s" repeatCount="indefinite"/>
    </text>

    <text x="36" y="440" opacity="0">
      <tspan fill="#58a6ff">fahad@redteam</tspan><tspan fill="#8b949e">:~$ </tspan>
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.03;0.95;1" dur="13s" begin="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="206" y="426" width="11" height="18" fill="#58a6ff" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.1s" begin="9s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
</svg>
